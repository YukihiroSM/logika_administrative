<div class="tab-pane fade" id="lesson-comments" role="tabpanel"
     aria-labelledby="lesson-comments-tab">
    <div class="ap-post-content">
        <div class="row">
            <div class="col-lg-12 mb-30">
                <div class="card global-shadow mb-30">
                    <div class="friends-widget">
                        <div class="col-lg-18">
                            <div class="card card-default card-md mb-4">
                                <div class="card-header py-20">
                                    <h6>Додати коментар</h6>
                                </div>
                                <div class="card-body pb-10">
                                    <div class="reply-editor media">

                                        <div class="reply-editor__form media-body">
                                            <form action="{% url 'logika_teachers:create-comment' %}"
                                                  method="post">
                                                {% csrf_token %}
                                                <div class="row">
                                                    <div class="form-group col-12">
                                                        <textarea name="comment"
                                                                  class="form-control mb-4"></textarea>
                                                        <div class="form-floating">
                                                            <input type="text" name="group_id" id="group_id_input"
                                                           class="form-control form-control-lg mb-4">
                                                            <label for="group_id_input" id="group_name_label">Введіть ID групи</label>
                                                        </div>

                                                        <input type="hidden" name="next"
                                                               value="{{ request.path }}">
                                                        <input type="hidden" name="comment_type"
                                                               value="lesson">
                                                        <input type="hidden" name="teacher"
                                                               value="{{ teacher_profile.id }}">
                                                        <button type="submit"
                                                                class="btn btn-primary btn-lg btn-squared btn-shadow-primary fw-400">
                                                            Додати коментар
                                                        </button>
                                                    </div>
                                                </div>
                                            </form>
                                        </div>

                                    </div>

                                </div>
                                <div class="col-lg-12">
                                    <div class="card card-default card-md mb-4">
                                        <div class="card-header px-md-25 px-3">
                                            <h6></h6>
                                        </div>
                                        <div class="card-body">
                                            <div class="timeline-box">
                                                {% for comment in lesson_comments %}
                                                <div class="timeline-single d-flex">
                                                    <span class="timeline-line"></span>
                                                    <span class="timeline-single__buble buble-success"></span>
                                                    <p>
                                                        {{comment.created_at}}
                                                    </p>
                                                    <div class="timeline-single__content">
                                                        <p>Група: <a href="https://lms.logikaschool.com/group/view/{{ comment.group_id }}" target="_blank">{{ comment.group_title }}</a></p>
                                                        <p>{{comment.comment|safe}}</p>
                                                    </div>
                                                </div>
                                                {% endfor %}
                                            </div>
                                        </div>
                                    </div>

                                </div>
                            </div>

                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const group_input = document.getElementById("group_id_input")
        const group_label = document.getElementById("group_name_label")
        group_input.addEventListener("input", function () {
           clearTimeout(group_input.timer);
           group_input.timer = setTimeout(() => {
               if (group_label) {
                const value = encodeURIComponent(group_input.value);
                const url = `{% url 'logika_teachers:get_group_title' %}?group_id=${value}`;
                fetch(url)
                    .then(response => response.json())
                    .then(data => {
                        if (data.value) {
                            group_label.textContent = data.value;
                        } else {
                            group_label.textContent = 'Щось пішло не так';
                        }
                    })
                    .catch(error => {
                        console.error('Error fetching name:', error);
                        group_label.textContent = 'Сервер не відповідає';
                    });

               }
           }, 1000);
        });
    });
</script>
